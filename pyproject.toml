[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mb-community-toolkit"
version = "0.1.0"
description = "An open-source suite of verification, conversion, and best-practice tools for the Generic Sensor Format (GSF)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Spatialnetics", email = "info@spatialnetics.com"},
]
keywords = [
    "gsf",
    "bathymetry",
    "sonar",
    "hydrography",
    "multibeam",
    "singlebeam",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "numpy>=1.20.0",
    "gsfu>=0.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
]

[project.scripts]
gsf-info = "tools.gsf_info:main"
gsf-verify = "tools.gsf_verify:main"
gsf-repair = "tools.gsf_repair:main"
gsf-timecheck = "tools.gsf_timecheck:main"

[project.urls]
Homepage = "https://github.com/your-org/community-gsf-toolkit"
Documentation = "https://github.com/your-org/community-gsf-toolkit#readme"
Repository = "https://github.com/your-org/community-gsf-toolkit"
Issues = "https://github.com/your-org/community-gsf-toolkit/issues"

[tool.setuptools]
packages = ["tools"]
include-package-data = true

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

